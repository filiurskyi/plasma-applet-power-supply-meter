name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch ships current Qt 6 and KDE Frameworks with every tool `make check`
    # needs (qmllint, qmlformat, qmltestrunner, gettext, reuse).
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          qt6-declarative libplasma plasma5support kirigami kquickcharts kcmutils kdeclarative kpackage
          gettext libxml2 python reuse shellcheck make git diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run all checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/usr/lib/qt6/bin:$PATH"
          make check
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: /tmp/runtime

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plasmoid
          path: dist/
          if-no-files-found: error
